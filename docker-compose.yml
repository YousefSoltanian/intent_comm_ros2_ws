version: '3.8'

services:
  intent_comm:
    build:
      context: .
      dockerfile: Dockerfile
    image: intent-comm-ros2:latest
    container_name: intent-comm-ros2
    stdin_open: true
    tty: true
    
    # Port mappings
    ports:
      - "1883:1883"    # MQTT broker
      - "7400:7400/udp"  # ROS 2 DDS discovery (optional)
    
    # Environment variables
    environment:
      - DISPLAY=${DISPLAY}
      - CONTROLLER=npace
      - TRIAL_ID=0
    
    volumes:
      # Mount X11 socket for GUI (Linux only)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount rollouts directory for output
      - ./rollouts:/ws/rollouts
      # Uncomment to mount source for development
      # - ./src:/ws/src
    
    # Uncomment if you need network access or specific capabilities
    # network_mode: host
