version: '3.8'

services:
  intent_comm:
    build:
      context: .
      dockerfile: Dockerfile
    image: intent-comm-ros2:latest
    container_name: intent-comm-ros2
    stdin_open: true
    tty: true
    ports:
      - "1883:1883"
      - "7400:7400/udp"
    environment:
      - DISPLAY=${DISPLAY}
      - CONTROLLER=${CONTROLLER:-npace}
      - TRIAL_ID=${TRIAL_ID:-0}
      - SUBJECT_NAME=${SUBJECT_NAME:-subject_0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rollouts:/ws/rollouts
      - ./config:/ws/config:ro
    command: >
      ros2 launch intent_comm_nav_ros experiment.launch.py
        controller:=${CONTROLLER}
        trial_id:=${TRIAL_ID}
        subject_name:=${SUBJECT_NAME}
        params_file:=/ws/config/experiment_params.yaml
