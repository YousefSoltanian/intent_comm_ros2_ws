name: CI (colcon build + sanity)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-sanity:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 (Humble)
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install build tools + rosdep deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-rosdep python3-colcon-common-extensions

          sudo rosdep init || true
          rosdep update

          # Install system deps declared in package.xml files
          rosdep install --from-paths src --ignore-src -r -y --rosdistro humble

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --symlink-install

      - name: Sanity import check (after build)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash

          python3 - <<'PY'
          import importlib

          modules = [
              "intent_comm_nav_ros",
              "intent_comm_nav_vendor",
              "iLQGame",
          ]

          for m in modules:
              importlib.import_module(m)
              print(f"Imported: {m}")

          print("Sanity checks passed.")
          PY
